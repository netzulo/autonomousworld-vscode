name: "🐛 Bug report"
description: Report a reproducible defect
title: "bug: <short summary>"
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please provide enough detail to reproduce.
  - type: input
    id: scope
    attributes:
      label: Scope
      description: Which area is affected? (Dockerfile, scripts, code-server, MCPs, etc.)
      placeholder: "e.g., Dockerfile / install_go.sh / mcp.json"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened vs. what you expected
      placeholder: "Observed vs. expected behavior"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, reproducible steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant logs, stack traces, or command output
      render: shell
  - type: input
    id: version
    attributes:
      label: Image tag / Version
      placeholder: "edge, v1.2.3, commit sha"
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "linux/amd64, linux/arm64, macOS Apple Silicon"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Ubuntu 22.04 + Docker 26.x; Docker Desktop 4.x; etc."
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for existing issues and found no duplicates
          required: true
        - label: I can provide a minimal repro (if applicable)
