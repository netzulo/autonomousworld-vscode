# Pull Request

> Use a clear, conventional title (e.g., `feat: add GHCR publish`, `fix: mcp json path`).

## Summary
Describe the change in 1–3 sentences.

## Type of change
- [ ] feat (new feature)
- [ ] fix (bug fix)
- [ ] docs (documentation only)
- [ ] refactor (no functional change)
- [ ] chore (build/CI/deps)
- [ ] perf (performance)
- [ ] style (formatting)

