name: "✨ Feature request"
description: Propose a new capability
title: "feat: <short idea>"
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What use case or pain point does this address?
      placeholder: "What can’t you do today?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include UX examples, CLI flags, etc.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope vs. out of scope?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options and why they’re not sufficient
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Objective conditions to consider it done
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Affects Docker image
        - label: Affects installation scripts
        - label: Affects MCPs / mcp.json
        - label: Potential breaking change
