name: "❓ Question / Help"
description: Usage questions, setup, or support
title: "docs/help: <question>"
labels: ["question"]
assignees: []
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need to understand or achieve?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you’ve tried
      description: Commands, docs, or steps you already attempted
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / Tag
      placeholder: "edge, vX.Y.Z"
